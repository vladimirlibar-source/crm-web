.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:grid;gap:2px;cursor:pointer;transition:.15s}

const API_URL='https://script.google.com/macros/s/AKfycbwbOpQBsGbxaKf-67P27foPKMDzO5hdm39Ub3qMXawWtrL15jRaylnrpksaPaLFZSqi/exec', CLIENT_ID='472337429434-db5ek8j030m46qn2m972e78pd01s5vmi.apps.googleusercontent.com';

const BAD=['Нет следующего шага','Просрочена задача','Этап просрочен'];
async function api(fn,...args){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({token:tok,fn,args})}),j=await r.json();
  if(!j.ok){if(j.error==='AUTH')logout();throw new Error(j.error)}return j.data}

const run=async f=>{try{await f()}catch(e){if(e.message!=='AUTH')toast(e.message)}};
function login(){$('#app').hidden=true;$('#login').hidden=false;
  google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:false,callback:r=>gLogin(r.credential)});
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large'})}
async function gLogin(c){try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn:'login',gtoken:c})}),j=await r.json();if(!j.ok)throw new Error(j.error);tok=j.data.sess;localStorage.setItem('sess',tok);start()}catch(e){$('#lerr').textContent=e.message}}
function logout(){if(tok)fetch(API_URL,{method:'POST',body:JSON.stringify({token:tok,fn:'logout'})}).catch(()=>{});tok=null;localStorage.removeItem('sess');localStorage.removeItem('tok');localStorage.removeItem('snap');if(window.google)google.accounts.id.disableAutoSelect();login()}
async function start(){
  const sn=JSON.parse(localStorage.getItem('snap')||'null');
  if(sn&&tok){D=sn.b;L=sn.l;DASH=sn.d;ALLF=sn.a;$('#login').hidden=true;$('#app').hidden=false;draw()}
  try{const r=await api('initAll');D=r.b;L=r.l;DASH=r.d;ALLF=r.a;localStorage.setItem('snap',JSON.stringify(r));$('#login').hidden=true;$('#app').hidden=false;draw()}
  catch(e){if(e.message!=='AUTH'){tok=null;localStorage.removeItem('sess');localStorage.removeItem('snap');login();$('#lerr').textContent=e.message}}}
const reload=async()=>{const r=await api('initAll');D=r.b;L=r.l;DASH=r.d;ALLF=r.a;localStorage.setItem('snap',JSON.stringify(r));draw()};
function go(p){page=p;$('#q').value='';draw()}
async function draw(){
  $('#who').textContent=D.user.name+' · '+D.user.role;
  $('#nav').innerHTML='<button data-p="home" onclick="go(\'home\')">🏠 Главная</button><button data-p="day" onclick="go(\'day\')">📅 Мой день</button>'+Object.keys(E).map(k=>'<button data-p="'+k+'" onclick="go(\''+k+'\')">'+E[k].n+'</button>').join('');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  const q=$('#q').value.toLowerCase();
  if(page!=='day'&&!C[page])$('#main').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{$('#main').innerHTML=page==='home'?await vHome():page==='day'?vDay():await vEnt(page,q)}catch(e){if(e.message!=='AUTH')$('#main').innerHTML='<p class="m">'+esc(e.message)+'</p>'}}

const E={
clients:{n:'👥 Клиенты',id:'ID клиента',t:'Контрагент (кратко)',s:['Статус','Менеджер','Телефон'],add:'newClient',

contacts:{n:'📇 Контакты',id:'ID контакта',t:'ФИО',s:['Клиент','Должность','Телефон'],

const P=s=>s.split(';').map(x=>{const m=x.split(':');let k=m[0],l=k;if(k.includes('='))[k,l]=k.split('=');return{k,l,t:m[1]||'t',a:m[2]||'',d:m[3]||''}});
const C={};let L={},PRE=null;
const rows=async k=>C[k]||(C[k]=await api('listRows',k));
const val=v=>/^\d{4}-\d{2}-\d{2}/.test(v)?fd(v):(v??'');
function inp(f,v,row){const d='data-k="'+esc(f.k)+'" data-t="'+f.t+'"'+(f.d?' data-dep="'+esc(f.d)+'" data-ent="'+f.a+'"':''),x=v==null?'':v,pv=f.d&&row?row[f.d]:'';
 if(f.t==='m')return'<textarea '+d+' rows=3>'+esc(x)+'</textarea>';
 if(f.t==='d')return'<input type=date '+d+' value="'+esc(String(x).slice(0,10))+'">';
 if(f.t==='n')return'<input type=number step=any '+d+' value="'+esc(x)+'">';
 let o=null;if(f.t==='s')o=(L[f.a]||[]).map(a=>[a,a]);if(f.t==='@')o=D.staff.map(a=>[a,a]);
 if(f.t==='r')o=(C[f.a]||[]).filter(r=>!pv||r[f.d]===pv).map(r=>[r[E[f.a].id],r[E[f.a].t]+' · '+r[E[f.a].id]]);
 if(!o)return'<input '+d+' value="'+esc(x)+'">';
 if(x&&!o.some(a=>a[0]===x))o.push([x,x]);
 return'<select '+d+' onchange="dep(this)"><option value=""></option>'+o.map(a=>'<option value="'+esc(a[0])+'"'+(a[0]===x?' selected':'')+'>'+esc(a[1])+'</option>').join('')+'</select>'}

 return'<div class="bar"><h3 style="margin:0">'+e.n+' · '+T.length+'</h3>'+(e.noadd?'':'<button onclick="'+(e.wiz?'wiz()':'openF(\''+k+'\')')+'">＋ '+(e.wiz?'Заказ из позиций':'Добавить')+'</button>')+'</div>'+

  (e.act?'<div class="f"><select onclick="event.stopPropagation()" onchange="act(\''+k+'\',\''+id+'\',this.value)">'+(L[e.act.l]||[]).map(s=>'<option'+(s===r[e.act.k]?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div>':'')+
  (e.btn&&!r[e.btn.no]?'<div class="f"><button onclick="event.stopPropagation();btn(\''+k+'\',\''+id+'\')">'+e.btn.l+'</button></div>':'')+
  (BAD.includes(r['Контроль'])?'<span class="b">'+esc(r['Контроль'])+'</span>':'')+'</div>'}).join('')||'<p class="m">Пока пусто. Нажмите «Добавить».</p>')}

 const r=id?(C[k]||[]).find(x=>x[e.id]===id):(x=>(PRE=null,x))(PRE),F=P(!id&&e.c?e.c:e.f);
 $('#dc').innerHTML='<h3 style="margin-top:0">'+esc(e.n)+(id?' · '+esc(id):'')+'</h3><div id="rel"></div><div class="f">'+F.map(f=>'<label>'+esc(f.l)+inp(f,r?r[f.k]:'',r)+'</label>').join('')+'</div>'+
 '<div class="bar" style="margin-top:14px"><button class="g" onclick="dlg.close()">Отмена</button>'+(id&&k==='orders'?'<button class="g" onclick="toItems(\''+id+'\')">🧾 Позиции</button><button class="g" onclick="wiz(null,\''+id+'\')">➕ Позиции</button>':'')+(id&&k==='projects'?'<button class="g" onclick="wiz(\''+id+'\')">🛒 Заказ</button><button class="g" onclick="addPos(\''+id+'\')">➕ Позиция</button>':'')+(id?'<button class="g" onclick="arch(\''+k+'\',\''+id+'\')">'+(e.del?'Удалить':'В архив')+'</button>':'')+'<button onclick="save(\''+k+'\','+(id?'\''+id+'\'':'null')+')">Сохранить</button></div>';
 dlg.showModal();if(id&&['clients','projects','orders'].includes(k))relLoad(k,id)}

const after=async m=>{dlg.close();Object.keys(C).forEach(x=>delete C[x]);toast(m);await reload()};
const save=(k,id)=>run(async()=>{const e=E[k],o=collect();let r;
 if(id){o[e.id]=id;await api('saveRow',k,o);return after('Сохранено')}
 if(e.add){if(o.orders)o.orders=String(o.orders).split(/[\s,;]+/).filter(Boolean);r=await api(e.add,o);
  return after(r&&r.warnings&&r.warnings.length?'⚠️ '+r.warnings.map(w=>w.msg).join('; '):'Создано')}
 await api('saveRow',k,o);return after('Создано')});
const arch=(k,id)=>{if(confirm(E[k].del?'Удалить запись?':'Убрать запись в архив?'))run(async()=>{if(E[k].del)await api('delRow',k,id);else await api('saveRow',k,{[E[k].id]:id,'Архив':'Да'});await after(E[k].del?'Удалено':'Архивировано')})};
const toItems=id=>{dlg.close();go('oitems');$('#q').value=id;draw()};
function dep(el){document.querySelectorAll('#dc [data-dep]').forEach(c=>{if(c.dataset.dep!==el.dataset.k)return;const a=c.dataset.ent,e=E[a],old=c.value;c.innerHTML='<option value=""></option>'+(C[a]||[]).filter(r=>!el.value||r[c.dataset.dep]===el.value).map(r=>'<option value="'+esc(r[e.id])+'"'+(r[e.id]===old?' selected':'')+'>'+esc(r[e.t]+' · '+r[e.id])+'</option>').join('')})}
const act=(k,id,v)=>run(async()=>{const r=await api(E[k].act.fn,id,v);await after(r&&r.purchase?(r.existed?'Закупка уже есть: ':'Заказ сформирован. Создана закупка ')+r.purchase+(r.warnings&&r.warnings.length?' ⚠️ '+r.warnings.map(w=>w.msg).join('; '):''):'Обновлено')});
const btn=(k,id)=>run(async()=>{await api(E[k].btn.fn,id);await after('Готово')});

async function vHome(){const d=DASH||await api('dashboard'),k=d.kpi,hr=new Date().getHours(),nm=(D.user.name.split(' ')[1]||D.user.name);
 const K=(i,l,v,p,c)=>'<div class="kpi '+(c||'')+'" onclick="go(\''+p+'\')"><span>'+i+'</span><b>'+v+'</b><small>'+l+'</small></div>',mx=Math.max(1,...d.funnel.map(x=>x[1]));
 const ch=n=>n<0?'<span class="chip bad">просрочено '+(-n)+' дн.</span>':n===0?'<span class="chip wn">сегодня</span>':'<span class="chip">через '+n+' дн.</span>';
 return'<h2 class="hi">'+(hr<6?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер')+', '+esc(nm)+' 👋</h2><div class="kp">'+
 K('📋','Проектов в работе',k.projects,'projects')+K('🔴','Просрочено задач',k.overdue,'day',k.overdue?'bad':'')+K('🟠','Задач на сегодня',k.today,'day',k.today?'wn':'')+K('🛒','Заказов',k.orders,'orders')+K('👥','Клиентов',k.clients,'clients')+'</div>'+
 '<div class="two"><div class="card"><b>Воронка проектов</b>'+(d.funnel.map(f=>'<div class="fn"><span>'+esc(f[0])+'</span><i style="width:'+Math.round(f[1]/mx*100)+'%"></i><b>'+f[1]+'</b></div>').join('')||'<p class="m">Нет данных</p>')+'</div>'+
 '<div class="card"><b>🔴 Просроченные задачи</b>'+(d.overdue.map(t=>'<div class="li"><div>'+esc(t.task)+'<div class="m">'+esc(t.who)+(t.obj?' · '+esc(t.obj):'')+'</div></div>'+ch(-Math.round((new Date(D.today)-new Date(t.due))/864e5))+'</div>').join('')||'<p class="m">Просрочек нет ✅</p>')+'</div>'+
 '<div class="card"><b>💳 Ближайшие оплаты</b>'+(d.pays.map(p=>'<div class="li"><div>'+esc(p.client)+'<div class="m">'+esc(p.order)+' · '+esc(p.part)+(p.sum?' · '+esc(p.sum):'')+'</div></div>'+ch(p.days)+'</div>').join('')||'<p class="m">Оплат на ближайшие 2 недели нет</p>')+'</div>'+
 '<div class="card"><b>🕘 Последние действия</b>'+(d.recent.map(r=>'<div class="li"><div>'+esc(r.text)+'<div class="m">'+esc(r.who)+' · '+fd(r.when)+'</div></div></div>').join('')||'<p class="m">Пока пусто</p>')+'</div></div>'}

const RL={contacts:'📇 Контакты',contracts:'📄 Договоры',projects:'📋 Проекты',orders:'🛒 Заказы',positions:'🧩 Позиции проекта',items:'🧾 Позиции',purchases:'📦 Закупки',tasks:'✅ Задачи',journal:'🕘 История'};
async function relLoad(k,id){try{const r=await api('related',k,id),el=$('#rel');if(!el)return;
 el.innerHTML=Object.keys(RL).filter(x=>r[x]&&r[x].length).map(x=>'<details class="card" style="padding:8px 12px"><summary><b>'+RL[x]+'</b> <span class="chip">'+r[x].length+'</span></summary>'+r[x].map(i=>'<div class="li"><div>'+esc(i[0])+'<div class="m">'+esc(i[1])+'</div></div></div>').join('')+'</details>').join('')}catch(e){}}
const PK=['clients','projects','orders','contacts'];
async function pal(){await Promise.all(PK.map(rows));$('#dc').innerHTML='<input id="pq" placeholder="Поиск по клиентам, проектам, заказам, контактам…" oninput="palr()" style="width:100%"><div id="pr"></div>';dlg.showModal();$('#pq').focus()}
function palr(){const q=$('#pq').value.toLowerCase(),o=[];if(q.length<2){$('#pr').innerHTML='';return}
 PK.forEach(k=>(C[k]||[]).forEach(r=>{if(Object.values(r).join(' ').toLowerCase().includes(q))o.push([k,r])}));
 $('#pr').innerHTML=o.slice(0,12).map(a=>{const k=a[0],r=a[1],id=esc(r[E[k].id]);return'<div class="li" style="cursor:pointer" onclick="dlg.close();page=\''+k+'\';draw();openF(\''+k+'\',\''+id+'\')"><div><b>'+esc(r[E[k].t]||r[E[k].id])+'</b><div class="m">'+E[k].n+' · '+id+'</div></div></div>'}).join('')||'<p class="m">Ничего не найдено</p>'}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#app').hidden)pal()}});
const addPos=id=>{dlg.close();PRE={'ID проекта':id};openF('pitems')};
async function wiz(pid,oid){await Promise.all(['projects','pitems','orders'].map(rows));if(oid)await rows('oitems');
 const o=oid?C.orders.find(x=>x['ID заказа']===oid):null;if(o)pid=o['ID проекта'];
 $('#dc').innerHTML='<h3 style="margin-top:0">'+(oid?'➕ Позиции в заказ '+esc(oid):'🛒 Новый заказ из позиций проекта')+'</h3><div class="f">'+
  (oid?'':'<label>Проект'+inp({k:'projectId',t:'r',a:'projects'},pid||'')+'</label><label>Условия оплаты'+inp({k:'terms',t:'s',a:'Условия оплаты'},'')+'</label><label>Условия доставки'+inp({k:'incoterms',t:'s',a:'Incoterms'},'')+'</label>')+
  '</div><div id="wp" style="margin-top:8px"></div><div class="bar" style="margin-top:14px"><button class="g" onclick="dlg.close()">Отмена</button><button onclick="wizGo(\''+(oid||'')+'\')">Сформировать</button></div>';
 $('#dc').onchange=e=>{if(e.target.dataset.k==='projectId')wizPos(e.target.value,'')};dlg.showModal();wizPos(pid,oid||'')}
function wizPos(pid,oid){const mgr=ALLF,used=oid?(C.oitems||[]).filter(i=>i['ID заказа']===oid).map(i=>i['ID позиции проекта']):[];
 const P=(C.pitems||[]).filter(p=>p['ID проекта']===pid&&!used.includes(p['ID позиции'])),fl=(f,ph,v,t)=>'<input '+(t||'type=number step=any')+' placeholder="'+ph+'" data-f="'+f+'" value="'+esc(v)+'">';
 $('#wp').innerHTML=!pid?'<p class="m">Выберите проект.</p>':P.length?P.map(p=>'<div class="card"><label style="display:flex;gap:8px;align-items:center"><input type=checkbox data-w="'+esc(p['ID позиции'])+'" style="width:auto" checked><b>'+esc(p['Номенклатура']||p['ID позиции'])+'</b></label><div class="m">'+esc(p['ID поставщика']||'⚠️ поставщик не указан')+' · в проекте '+esc(p['Объём, кг']||'—')+' кг</div><div class="f" style="grid-template-columns:1fr 1fr">'+fl('q','Кол-во, кг',p['Объём, кг']||'')+fl('pack','Фасовка','','type=text')+(mgr?fl('buy','Цена закупки',''):'')+fl('sell','Цена продажи','')+'</div></div>').join(''):'<p class="m">В проекте нет позиций, которые можно добавить. Сначала добавьте позиции проекта.</p>'}
function wizGo(oid){const lines=[],gv=k=>{const x=document.querySelector('#dc [data-k="'+k+'"]');return x?x.value:''};
 document.querySelectorAll('#wp .card').forEach(c=>{const cb=c.querySelector('[data-w]');if(!cb||!cb.checked)return;const g=f=>{const x=c.querySelector('[data-f="'+f+'"]');return x?x.value:''};lines.push({pid:cb.dataset.w,qty:g('q'),pack:g('pack'),buy:g('buy'),sell:g('sell')})});
 run(async()=>{const r=await api('orderBuild',{orderId:oid,projectId:gv('projectId'),terms:gv('terms'),incoterms:gv('incoterms'),lines});if(r.created)page='orders';
  await after((r.created?'Заказ '+r.id+' сформирован':'Позиции добавлены в '+r.id)+' ('+r.count+' поз.)'+(r.warnings&&r.warnings.length?' ⚠️ '+r.warnings.map(w=>w.msg).join('; '):''))})}
function vDay(){
  const T=D.tasks.slice().sort((a,b)=>String(a['Срок']||'9').localeCompare(String(b['Срок']||'9')));
  const g=t=>!t['Срок']?2:t['Срок']<D.today?0:t['Срок']===D.today?1:2,N=['🔴 Просрочено','🟠 Сегодня','🗓 Далее'];
  let h='<details class="card"><summary>➕ Новая задача</summary><div class="f"><input id="nt" placeholder="Что сделать"><select id="na">'+
   D.staff.map(s=>'<option'+(s===D.user.name?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select><input id="nd" type="date" value="'+D.today+'"><select id="np">'+
   D.lists.priorities.map(p=>'<option>'+esc(p)+'</option>').join('')+'</select><button onclick="addT()">Создать</button></div></details>';
  [0,1,2].forEach(i=>{const L=T.filter(t=>g(t)===i);if(!L.length)return;
   h+='<h3>'+N[i]+' · '+L.length+'</h3>'+L.map(t=>'<div class="card row"><div><b>'+esc(t['Задача'])+'</b><div class="m">до '+fd(t['Срок'])+' · '+esc(t['Исполнитель'])+(t['ID объекта']?' · '+esc(t['ID объекта']):'')+'</div></div><button onclick="done(\''+esc(t['ID задачи'])+'\')">✓</button></div>').join('')});
  return h+(T.length?'':'<p class="m">Открытых задач нет 🎉</p>')}
const addT=()=>run(async()=>{await api('addTask',{'Задача':$('#nt').value,'Исполнитель':$('#na').value,'Срок':$('#nd').value,'Приоритет':$('#np').value,'Тип задачи':'Другое',objType:'',objId:''});toast('Задача создана');await reload()});
const done=id=>{const r=prompt('Результат (обязательно):');if(r===null)return;D.tasks=D.tasks.filter(t=>t['ID задачи']!==id);draw();run(async()=>{try{await api('completeTask',id,r)}catch(e){await reload();throw e}await reload()})};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
window.addEventListener('load',()=>tok?start():login());
</script></body></html>
